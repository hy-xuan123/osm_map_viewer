// 保存最近一次 updateInfoPanel 调用的统计数据（供动态更新信号灯数量使用）
// 默认值对应贵港市原始数据
let lastRoadTypeCounts = {'primary': 5, 'primary_link': 2, 'secondary': 8, 'tertiary': 10, 'tertiary_link': 1, 'residential': 15, 'service': 20, 'unclassified': 5, 'trunk_link': 1, 'footway': 10, 'motorway': 2, 'trunk': 1, 'living_street': 1, 'path': 1, 'cycleway': 1};
let lastBuildingCount = 27;
let lastWaterCount = 2;
let lastLanduseCount = 9;
let lastPoiCount = 9;
let lastJunctionCount = 106;
let lastIntersectionCount = 56;
let lastTitle = '贵港市';

// 默认图例和统计（贵港市原始数据）
const defaultInfo = {
    title: '贵港市',
    legend: `<span style="display:inline-block;width:14px;height:14px;background:#f39c12;border-radius:3px;margin-right:4px;vertical-align:middle"></span>主干道 <span style="display:inline-block;width:14px;height:14px;background:#999999;border-radius:3px;margin-right:4px;vertical-align:middle"></span>主路匝道 <span style="display:inline-block;width:14px;height:14px;background:#3498db;border-radius:3px;margin-right:4px;vertical-align:middle"></span>三级路 <span style="display:inline-block;width:14px;height:14px;background:#2ecc71;border-radius:3px;margin-right:4px;vertical-align:middle"></span>次干道 <span style="display:inline-block;width:14px;height:14px;background:#7f8c8d;border-radius:3px;margin-right:4px;vertical-align:middle"></span>服务路 <span style="display:inline-block;width:14px;height:14px;background:#9b59b6;border-radius:3px;margin-right:4px;vertical-align:middle"></span>住宅区路 <span style="display:inline-block;width:14px;height:14px;background:#999999;border-radius:3px;margin-right:4px;vertical-align:middle"></span>三级路匝道 <span style="display:inline-block;width:14px;height:14px;background:#607d8b;border-radius:3px;margin-right:4px;vertical-align:middle"></span>未分类 <span style="display:inline-block;width:14px;height:14px;background:#999999;border-radius:3px;margin-right:4px;vertical-align:middle"></span>主干路匝道 <span style="display:inline-block;width:14px;height:14px;background:#1abc9c;border-radius:3px;margin-right:4px;vertical-align:middle"></span>人行道`,
    stats: '道路: 83段 | 建筑: 27栋 | 水域: 2处 | 用地: 9块 | POI: 9<br>交叉口: 106个 | 路口: 56个 | 信号灯: 0个'
};

function updateInfoPanel(title, roadTypeCounts, buildingCount, waterCount, landuseCount, poiCount, junctionCount, intersectionCount, trafficSignalsCount) {
    const infoDiv = document.getElementById('info');
    if (!infoDiv) return;

    // 更新标题
    infoDiv.querySelector('h3').textContent = title || 'OSM数据';

    // 动态生成图例 - 只显示实际存在的道路类型
    let legendHtml = '';
    if (roadTypeCounts && Object.keys(roadTypeCounts).length > 0) {
        const sortedTypes = Object.keys(roadTypeCounts).sort((a, b) => {
            // 排序: 主要道路在前
            const order = ['primary', 'trunk', 'motorway', 'secondary', 'tertiary', 'residential', 'unclassified', 'service', 'footway', 'pedestrian', 'path', 'primary_link', 'secondary_link', 'tertiary_link', 'trunk_link', 'motorway_link', 'living_street', 'cycleway'];
            const ai = order.indexOf(a);
            const bi = order.indexOf(b);
            return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        });
        sortedTypes.forEach(hw => {
            const color = roadTypeColors[hw] || '#999999';
            const label = roadTypeLabels[hw] || hw;
            legendHtml += `<span style="display:inline-block;width:14px;height:14px;background:${color};border-radius:3px;margin-right:4px;vertical-align:middle"></span>${label} `;
        });
    } else {
        legendHtml = '<span style="color:#999;">无道路数据</span>';
    }

    // 添加交通信号灯图例
    const tCount = trafficSignalsCount || 0;
    if (tCount > 0) {
        legendHtml += `<span style="margin-left:8px;display:inline-block;width:14px;height:14px;text-align:center;line-height:14px;font-size:12px;vertical-align:middle;">🚦</span> 信号灯 `;
    }
    infoDiv.querySelector('.legend').innerHTML = legendHtml;

    // 更新统计信息
    const roadTotal = roadTypeCounts ? Object.values(roadTypeCounts).reduce((a, b) => a + b, 0) : 0;
    const bCount = buildingCount || 0;
    const wCount = waterCount || 0;
    const lCount = landuseCount || 0;
    const pCount = poiCount || 0;
    const jCount = junctionCount || 0;
    const iCount = intersectionCount || 0;
    // tCount 已在上方声明，此处直接使用

    infoDiv.querySelector('.stats').innerHTML =
        `道路: ${roadTotal}段 | 建筑: ${bCount}栋 | 水域: ${wCount}处 | 用地: ${lCount}块 | POI: ${pCount}<br>交叉口: ${jCount}个 | 路口: ${iCount}个 | 信号灯: ${tCount}个`;

    // 保存统计数据到全局变量，供 loadLocalTrafficSignals 等函数更新信号灯数量时使用
    lastRoadTypeCounts = roadTypeCounts || {};
    lastBuildingCount = bCount;
    lastWaterCount = wCount;
    lastLanduseCount = lCount;
    lastPoiCount = pCount;
    lastJunctionCount = jCount;
    lastIntersectionCount = iCount;
    lastTitle = title || 'OSM数据';
}

function restoreDefaultInfoPanel() {
    const infoDiv = document.getElementById('info');
    if (!infoDiv) return;
    infoDiv.querySelector('h3').textContent = defaultInfo.title;
    infoDiv.querySelector('.legend').innerHTML = defaultInfo.legend;
    infoDiv.querySelector('.stats').innerHTML = defaultInfo.stats;
    // 同步更新全局变量为贵港市默认值
    lastTitle = defaultInfo.title;
    lastRoadTypeCounts = {'primary': 5, 'primary_link': 2, 'secondary': 8, 'tertiary': 10, 'tertiary_link': 1, 'residential': 15, 'service': 20, 'unclassified': 5, 'trunk_link': 1, 'footway': 10, 'motorway': 2, 'trunk': 1, 'living_street': 1, 'path': 1, 'cycleway': 1};
    lastBuildingCount = 27;
    lastWaterCount = 2;
    lastLanduseCount = 9;
    lastPoiCount = 9;
    lastJunctionCount = 106;
    lastIntersectionCount = 56;
}

// === 清除下载的非道路图层 ===
function clearDownloadedExtraLayers() {
    if (downloadedBuildingLayer) { map.removeLayer(downloadedBuildingLayer); downloadedBuildingLayer = null; }
    if (downloadedWaterLayer) { map.removeLayer(downloadedWaterLayer); downloadedWaterLayer = null; }
    if (downloadedLanduseLayer) { map.removeLayer(downloadedLanduseLayer); downloadedLanduseLayer = null; }
    if (downloadedPoisLayer) { map.removeLayer(downloadedPoisLayer); downloadedPoisLayer = null; }
}








</script>
